<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Quiz Ultime : The Weeknd (XO)</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>THE WEEKND <span class="xo">XO</span> QUIZ</h1>
            <p>Prouve que tu es un vrai fan d'Abel Tesfaye.</p>
        </header>

        <main id="quiz-box">
            <div id="start-screen">
                <h2>Prêt à plonger dans la folie ?</h2>
                <button id="start-btn" class="btn">Commencer le Quiz</button>
            </div>

            <div id="question-screen" class="hidden">
                <h2 id="question-text">Question</h2>
                <div id="options-container">
                    </div>
                <p id="progress">Question 1 / 10</p>
            </div>

            <div id="result-screen" class="hidden">
                <h2>Résultats</h2>
                <p id="score-text">Tu as obtenu 0 sur 10 !</p>
                <p id="feedback-text"></p>
                <button id="restart-btn" class="btn">Rejouer</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
